AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Highly available auto-scaling web tier using EC2 Auto Scaling and
  Application Load Balancer. Deployed via CloudFormation GitSync.
  Region: eu-west-1 (Europe - Ireland)

Parameters:
  EnvironmentName:
    Type: String
    Default: AutoScalingLab
    Description: Prefix for all resource names

  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for the VPC

  PublicSubnet1CIDR:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR for public subnet in AZ-A

  PublicSubnet2CIDR:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR for public subnet in AZ-B

  PrivateSubnet1CIDR:
    Type: String
    Default: 10.0.3.0/24
    Description: CIDR for private subnet in AZ-A

  PrivateSubnet2CIDR:
    Type: String
    Default: 10.0.4.0/24
    Description: CIDR for private subnet in AZ-B

Resources:

  # ─────────────────────────────────────────
  # VPC
  # ─────────────────────────────────────────
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-VPC

  # ─────────────────────────────────────────
  # INTERNET GATEWAY
  # ─────────────────────────────────────────
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-IGW

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  # ─────────────────────────────────────────
  # PUBLIC SUBNETS
  # ─────────────────────────────────────────
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PublicSubnet1CIDR
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-PublicSubnet-AZ1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Ref PublicSubnet2CIDR
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-PublicSubnet-AZ2

  # ─────────────────────────────────────────
  # PRIVATE SUBNETS
  # ─────────────────────────────────────────
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PrivateSubnet1CIDR
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-PrivateSubnet-AZ1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Ref PrivateSubnet2CIDR
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-PrivateSubnet-AZ2

  # ─────────────────────────────────────────
  # NAT GATEWAY (in Public Subnet 1)
  # ─────────────────────────────────────────
  NatGatewayEIP:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-NAT-EIP

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-NATGateway

  # ─────────────────────────────────────────
  # ROUTE TABLES
  # ─────────────────────────────────────────
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-PublicRT

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-PrivateRT

  DefaultPrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet1

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet2

  # ─────────────────────────────────────────
  # SECURITY GROUPS
  # ─────────────────────────────────────────
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the Application Load Balancer
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Allow HTTP from internet
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ALB-SG

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EC2 instances in Auto Scaling Group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: Allow HTTP only from ALB
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-EC2-SG


  # ─────────────────────────────────────────
  # APPLICATION LOAD BALANCER
  # ─────────────────────────────────────────
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${EnvironmentName}-ALB
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ALB

  # ─────────────────────────────────────────
  # TARGET GROUP
  # ─────────────────────────────────────────
  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${EnvironmentName}-TG
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /
      HealthCheckPort: traffic-port
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: 200
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
        - Key: load_balancing.algorithm.type
          Value: round_robin
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-TG

  # ─────────────────────────────────────────
  # LISTENER
  # ─────────────────────────────────────────
  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  # ─────────────────────────────────────────
  # IAM ROLE FOR EC2 INSTANCES
  # ─────────────────────────────────────────
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-EC2-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-EC2-Role

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${EnvironmentName}-EC2-Profile
      Roles:
        - !Ref EC2InstanceRole

  # ─────────────────────────────────────────
  # LAUNCH TEMPLATE
  # ─────────────────────────────────────────
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub ${EnvironmentName}-LT
      LaunchTemplateData:
        ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
        InstanceType: t2.micro
        SecurityGroupIds:
          - !Ref EC2SecurityGroup
        IamInstanceProfile:
          Arn: !GetAtt EC2InstanceProfile.Arn
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 1
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -e
            exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1

            echo "=== Starting User Data Script ==="

            # Update system packages
            dnf update -y

            # Install Apache HTTP Server
            dnf install -y httpd stress

            # Get instance metadata using IMDSv2
            TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" \
              -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")

            INSTANCE_ID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/instance-id)

            AVAILABILITY_ZONE=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/placement/availability-zone)

            PRIVATE_IP=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/local-ipv4)

            # Deploy the web application
            cat > /var/www/html/index.html << 'HTML'
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Auto Scaling Lab</title>
              <style>
                * { margin: 0; padding: 0; box-sizing: border-box; }
                body {
                  font-family: Arial, sans-serif;
                  background: #f0f4f8;
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  min-height: 100vh;
                }
                .card {
                  background: white;
                  border-radius: 12px;
                  padding: 40px;
                  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
                  max-width: 600px;
                  width: 90%;
                  text-align: center;
                }
                .badge {
                  background: #FF9900;
                  color: white;
                  padding: 6px 16px;
                  border-radius: 20px;
                  font-size: 13px;
                  font-weight: bold;
                  display: inline-block;
                  margin-bottom: 20px;
                }
                h1 { color: #232F3E; font-size: 24px; margin-bottom: 8px; }
                .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
                .info-grid {
                  display: grid;
                  gap: 16px;
                  margin-bottom: 30px;
                }
                .info-item {
                  background: #f8f9fa;
                  border: 1px solid #e9ecef;
                  border-radius: 8px;
                  padding: 16px;
                  text-align: left;
                }
                .info-label {
                  font-size: 11px;
                  text-transform: uppercase;
                  color: #888;
                  letter-spacing: 1px;
                  margin-bottom: 6px;
                }
                .info-value {
                  font-size: 18px;
                  font-weight: bold;
                  color: #232F3E;
                  font-family: monospace;
                }
                .stress-section {
                  border-top: 1px solid #eee;
                  padding-top: 24px;
                }
                .stress-btn {
                  background: #dc3545;
                  color: white;
                  border: none;
                  padding: 12px 28px;
                  border-radius: 8px;
                  font-size: 15px;
                  cursor: pointer;
                  font-weight: bold;
                }
                .stress-btn:hover { background: #c82333; }
                .stress-note {
                  font-size: 12px;
                  color: #888;
                  margin-top: 10px;
                }
              </style>
            </head>
            <body>
              <div class="card">
                <div class="badge">AWS Auto Scaling Lab</div>
                <h1>Instance Information</h1>
                <p class="subtitle">Served by an EC2 instance behind the Application Load Balancer</p>
                <div class="info-grid">
                  <div class="info-item">
                    <div class="info-label">Instance ID</div>
                    <div class="info-value" id="instance-id">Loading...</div>
                  </div>
                  <div class="info-item">
                    <div class="info-label">Availability Zone</div>
                    <div class="info-value" id="az">Loading...</div>
                  </div>
                  <div class="info-item">
                    <div class="info-label">Private IP Address</div>
                    <div class="info-value" id="private-ip">Loading...</div>
                  </div>
                </div>
                <div class="stress-section">
                  <button class="stress-btn" onclick="triggerStress()">
                    Trigger CPU Stress Test
                  </button>
                  <p class="stress-note">Runs 60s CPU stress to trigger Auto Scaling scale-out</p>
                </div>
              </div>
              <script>
                fetch('/instance-info')
                  .then(r => r.json())
                  .then(d => {
                    document.getElementById('instance-id').textContent = d.instance_id;
                    document.getElementById('az').textContent = d.az;
                    document.getElementById('private-ip').textContent = d.private_ip;
                  })
                  .catch(() => {
                    document.getElementById('instance-id').textContent = 'INSTANCE_ID_PLACEHOLDER';
                    document.getElementById('az').textContent = 'AZ_PLACEHOLDER';
                    document.getElementById('private-ip').textContent = 'IP_PLACEHOLDER';
                  });

                function triggerStress() {
                  fetch('/stress')
                    .then(() => alert('CPU stress started on this instance for 60 seconds!'))
                    .catch(() => alert('Stress triggered'));
                }
              </script>
            </body>
            </html>
            HTML

            # Replace placeholders with actual metadata values
            sed -i "s/INSTANCE_ID_PLACEHOLDER/$INSTANCE_ID/g" /var/www/html/index.html
            sed -i "s/AZ_PLACEHOLDER/$AVAILABILITY_ZONE/g" /var/www/html/index.html
            sed -i "s/IP_PLACEHOLDER/$PRIVATE_IP/g" /var/www/html/index.html

            # Create instance-info JSON endpoint
            cat > /var/www/html/instance-info << EOF
            {"instance_id":"$INSTANCE_ID","az":"$AVAILABILITY_ZONE","private_ip":"$PRIVATE_IP"}
            EOF

            # Create stress endpoint using CGI
            dnf install -y mod_cgi

            mkdir -p /var/www/cgi-bin

            cat > /var/www/cgi-bin/stress.sh << 'STRESS'
            #!/bin/bash
            echo "Content-Type: text/plain"
            echo ""
            echo "CPU stress started"
            nohup stress --cpu 2 --timeout 60 &
            STRESS

            chmod +x /var/www/cgi-bin/stress.sh

            # Configure Apache
            cat > /etc/httpd/conf.d/app.conf << 'APACHECONF'
            Alias /stress /var/www/cgi-bin/stress.sh
            <Directory /var/www/cgi-bin>
                Options +ExecCGI
                AddHandler cgi-script .sh
            </Directory>
            APACHECONF

            # Enable and start Apache
            systemctl enable httpd
            systemctl start httpd

            echo "=== User Data Script Complete ==="
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub ${EnvironmentName}-Instance
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !Sub ${EnvironmentName}-Volume

  # ─────────────────────────────────────────
  # AUTO SCALING GROUP
  # ─────────────────────────────────────────
  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub ${EnvironmentName}-ASG
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: '1'
      DesiredCapacity: '1'
      MaxSize: '4'
      TargetGroupARNs:
        - !Ref ALBTargetGroup
      VPCZoneIdentifier:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      HealthCheckType: ELB
      HealthCheckGracePeriod: 120
      MetricsCollection:
        - Granularity: 1Minute
          Metrics:
            - GroupMinSize
            - GroupMaxSize
            - GroupDesiredCapacity
            - GroupInServiceInstances
            - GroupPendingInstances
            - GroupTerminatingInstances
            - GroupTotalInstances
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ASG-Instance
          PropagateAtLaunch: true
        - Key: Environment
          Value: !Ref EnvironmentName
          PropagateAtLaunch: true

  # ─────────────────────────────────────────
  # TARGET TRACKING SCALING POLICY
  # ─────────────────────────────────────────
  CPUTargetTrackingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 30.0
        ScaleInCooldown: 60
        ScaleOutCooldown: 60
        DisableScaleIn: false
      EstimatedInstanceWarmup: 120


  
Outputs:
  VPC:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub ${EnvironmentName}-VPC

  PublicSubnet1:
    Description: Public Subnet AZ1
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub ${EnvironmentName}-PublicSubnet1

  PublicSubnet2:
    Description: Public Subnet AZ2
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub ${EnvironmentName}-PublicSubnet2

  PrivateSubnet1:
    Description: Private Subnet AZ1
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub ${EnvironmentName}-PrivateSubnet1

  PrivateSubnet2:
    Description: Private Subnet AZ2
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub ${EnvironmentName}-PrivateSubnet2

  ALBSecurityGroup:
    Description: ALB Security Group ID
    Value: !Ref ALBSecurityGroup
    Export:
      Name: !Sub ${EnvironmentName}-ALB-SG

  EC2SecurityGroup:
    Description: EC2 Security Group ID
    Value: !Ref EC2SecurityGroup
    Export:
      Name: !Sub ${EnvironmentName}-EC2-SG


  ALBDNSName:
    Description: DNS name of the Application Load Balancer
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub ${EnvironmentName}-ALB-DNS

  ALBTargetGroup:
    Description: Target Group ARN
    Value: !Ref ALBTargetGroup
    Export:
      Name: !Sub ${EnvironmentName}-TG

  LaunchTemplate:
    Description: Launch Template ID
    Value: !Ref LaunchTemplate
    Export:
      Name: !Sub ${EnvironmentName}-LT

  AutoScalingGroup:
    Description: Auto Scaling Group Name
    Value: !Ref AutoScalingGroup
    Export:
      Name: !Sub ${EnvironmentName}-ASG

  ScalingPolicy:
    Description: Target Tracking Scaling Policy
    Value: !Ref CPUTargetTrackingPolicy
    Export:
      Name: !Sub ${EnvironmentName}-ScalingPolicy


